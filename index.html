<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="game-release" content="trial-20261118-6"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091224"><title>빛의 향연 · 열 곳의 불빛</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffdcaa' d='M32 2L39 25L62 32L39 39L32 62L25 39L2 32L25 25Z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=trial-20261118-6"><link rel="stylesheet" href="exploration.css?v=trial-20261118-6"><link rel="stylesheet" href="mission.css?v=trial-20261118-6"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script></head>
<body><main id="world" aria-label="빛의 향연 3D 광장"><canvas id="scene" aria-label="방향키나 WASD로 걷고 E로 회로를 열어요. 드래그로 둘러볼 수 있어요." tabindex="0"></canvas></main>
<header><div class="brand"><span class="emblem" aria-hidden="true">✦</span><div><h1>빛의 향연</h1><p id="chapter">열 곳의 불빛을 켜요</p></div></div><div class="top-actions"><button id="quality">화질</button><button id="restart-game" hidden>다시 시작</button><button id="clean" aria-label="화면 안내 숨기기">감상</button></div></header>
<div id="loading" role="status"><div class="loading-star">✦</div><p>빛의 도시를 준비하고 있어요</p></div>
<div id="error" role="alert" hidden><h2>3D 화면을 열지 못했어요</h2><p id="error-message"></p><button onclick="location.reload()">다시 열기</button></div>
<aside id="view-nav" aria-label="관찰 위치"><button data-view="entrance">광장 전경</button><button data-view="fox" aria-pressed="true">여우 따라가기</button></aside>
<div id="explore-controls" hidden><div id="move-pad" role="group" aria-label="이동 조이스틱. 방향키와 WASD로도 걸을 수 있어요."><span aria-hidden="true">✦</span></div><p>WASD · 방향키로 걷기<br>E 회로 열기</p></div>
<button id="mission-marker" hidden></button>
<section id="mission" hidden aria-label="현재 미션"><p id="mission-name"></p><p id="mission-line"></p><div class="mission-action-row"><span id="progress" aria-label="밝힌 장소">0 / 10</span><button id="mission-action">빛길 따라 걷기</button></div><p id="save-note" hidden>기록을 저장하지 못했어요. 현재 화면에서는 계속할 수 있어요.</p></section>
<div id="light-toast" role="status" aria-live="polite" hidden><span></span><button id="skip-light">연출 건너뛰기</button></div>
<footer><p id="hint">빛길을 따라 걸어가요</p><div class="dock"><div class="stages" role="group" aria-label="시안 빛의 변화"><button data-stage="0">잠든 도시</button><button data-stage="1">첫 불빛</button><button data-stage="2">빛의 향연</button></div></div><p id="status"></p></footer><button id="restore" hidden>안내 보기</button>
<dialog id="work-dialog" aria-labelledby="work-title" aria-describedby="work-goal"><div class="work-heading"><div><p id="work-step"></p><h2 id="work-title"></h2></div><button id="work-close" aria-label="회로판 닫기">×</button></div><p id="work-goal"></p><p id="work-message" role="status" aria-live="polite"></p><div id="work-board"><svg id="work-wires" aria-hidden="true"></svg><div id="work-parts"></div></div><div id="work-feedback" aria-label="회로 검사 결과"></div><div class="work-actions"><button id="work-undo">되돌리기</button><button id="work-erase" aria-pressed="false">선 지우기</button><button id="work-hint">힌트</button><button id="work-test">회로 시험하기</button></div><div class="work-bottom"><p id="work-note"></p><button id="work-reset">이 문제 처음부터</button></div></dialog>
<dialog id="restart-dialog" aria-labelledby="restart-title"><h2 id="restart-title">열 곳의 불빛을 처음부터 켤까요?</h2><p>이번 10개 미션의 진행이 처음으로 돌아가요.</p><button id="keep-game">이어서 하기</button><button id="confirm-restart">처음부터</button></dialog>
<noscript>JavaScript를 켠 브라우저에서 실행해 주세요.</noscript><script type="module" src="app.js?v=trial-20261118-6"></script></body></html>
